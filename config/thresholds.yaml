# Tunable targets and weights for the build audit.
#
# Values here are COMMUNITY ESTIMATES and heuristics, not official numbers.
# Nothing in the engine hardcodes anything from this file -- change freely.

class: Ranger
content: PvE

# Which weighting to use when no --profile is given.
default_profile: combat_power

# ---------------------------------------------------------------------------
# Goal profiles
# ---------------------------------------------------------------------------
# IMPORTANT HONESTY NOTE: PLAYNC publishes combatPower as a single number for
# your CURRENT state only. There is no endpoint that answers "what would my CP
# be if...". The formula behind it is not published either.
#
# So these weights are a RANKING HEURISTIC, not a CP calculation. They express
# "how much is one point of this stat worth toward this goal", scaled so that
# stats which arrive in large numbers (HP) do not drown out stats which arrive
# in small ones (Attack). The engine never claims a CP delta.
#
# The honest CP measurement is empirical: snapshots record combatPower over
# time, so once you act on a recommendation the next snapshot shows what it
# actually did. See `aion2 history`.

profiles:

  combat_power:
    label: Combat Power
    description: >
      Balanced offence and defence, for raising the headline Combat Power
      number. Weights both damage and survivability, since CP counts both.
    stat_weights:
      # offence
      WeaponFixingDamage: 2.0      # Attack
      DefensePierce: 1.2           # Penetration
      Critical: 1.2
      WeaponAccuracy: 1.0
      Accuracy: 1.0
      AmplifyAllDamage: 2.5
      AmplifyWeaponDamage: 2.5
      PvEAmplifyDamage: 2.5
      AdditionalHitRate: 1.0
      Perfect: 1.0
      SealStoneAddDamage: 0.5
      # attributes
      AGI: 2.0                     # Precision
      STR: 1.5                     # Might
      CON: 1.0                     # Constitution
      # defence -- real CP contribution, but low per-point because the raw
      # numbers are large
      ArmorDefense: 0.35
      HPMax: 0.08
      MPMax: 0.02
      CriticalDamageDefense: 0.1
      PvEDecreaseDamage: 1.0
      # utility
      CombatSpeed: 1.5
      Restoration: 0.1

  pve_dps:
    label: PvE Damage
    description: >
      Damage only. Defence and survivability score zero, so anything
      defensive reads as wasted budget. Use when gear is already comfortable
      and you want to push throughput.
    stat_weights:
      WeaponAccuracy: 3.0
      Accuracy: 3.0
      Critical: 1.5
      WeaponFixingDamage: 1.2
      DefensePierce: 1.0
      AmplifyWeaponDamage: 2.0
      AmplifyAllDamage: 2.0
      PvEAmplifyDamage: 2.0
      AdditionalHitRate: 1.0
      Perfect: 1.0
      AGI: 2.5
      STR: 0.8

  accuracy_rush:
    label: Accuracy Rush
    description: >
      Everything subordinated to hitting the raid accuracy floor. Use while
      Accuracy is the binding constraint, then switch away.
    stat_weights:
      WeaponAccuracy: 10.0
      Accuracy: 10.0
      AGI: 4.0
      Critical: 0.5
      WeaponFixingDamage: 0.5

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------

accuracy:
  # In-game Accuracy targets. The API cannot read your in-game total (see
  # docs/endpoints.md section 4), so these are for your own reference against
  # the figure you read in game.
  target_min: 1100
  target_max: 1200
  raid_target: 1450
  # Flat Accuracy readable from gear. Trend-tracking only.
  gear_warn_below: 250

critical_hit:
  marking_shot_bonus: 300      # Marking Shot adds a flat 300
  cap_target_percent: 50

attributes:
  # Precision (AGI) drives Accuracy and Critical Hit for a Ranger.
  # Dexterity (DEX) drives Evasion, Block and Crit Resist -- defensive.
  flag_dexterity_above_precision: true

# Specific skills worth calling out by name, checked on EFFECTIVE level
# (listed + Daevanion + Arcana).
skill_targets:
  Deadshot: 20
  Gale Arrow: 20
  Drill Dart: 16
  Snipe: 16
  Tempest Shot: 16
  Vaizel's Authority: 20

# The general sweep: every skill you actually use, measured against the cap.
# This is what answers "get my skills to 20" rather than only checking the
# handful named above.
skills:
  # Highest base level observed on any skill. Deadshot and Vaizel's Authority
  # both sit at 20 and nothing exceeds it.
  level_cap: 20
  # Ignore skills within this many levels of the cap, to avoid noise.
  min_gap_to_report: 1

  # The skills actually worth pushing. Recommendations about gear skill slots
  # target these rather than spreading across all 35, because a slot spent on
  # Explosion Trap is a slot not spent on Deadshot.
  #
  # Ordered most important first. Retune for your own rotation.
  key_active:
    - Deadshot
    - Snipe
    - Gale Arrow
    - Tempest Shot
    - Drill Dart
  key_passive:
    - Rooting Eye
    - Focused Eye
    - Concentrated Fire
    - Hunter's Soul
    - Vigilant Eye

# Gear-granted skill levels.
#
# Equipment carries `subSkills`, each worth +N to a named skill, with
# `subSkillCountMax` as the capacity. This is NOT Arcana-only -- rings,
# cloak, pauldrons, breastplate and necklace all carry them, and weapons and
# earrings have the largest capacity at 5.
#
# An empty slot is a free skill level going unused.
skill_slots:
  # Report items with at least this many empty slots.
  min_empty_to_report: 1

soul_binding:
  # Soul bind rate is a percentage per item. It is NOT always 100 -- our
  # Ranger's bow reads 13.3. What it does mechanically is not published and
  # there is no way to ask PLAYNC "what would this look like at 100", so the
  # engine reports completion and claims no stat gain.
  flag_below_percent: 90

# Stats that do nothing for Ranger PvE damage. Flagged as reroll or replace
# candidates on rolled sub-stats and manastones. Stat ids, not display names.
#
# Note these stay "wasted" even under the combat_power profile: a manastone
# slot is a fixed budget, so filling it with Block instead of Attack is a
# straight loss regardless of goal.
wasted_stats:
  - DEX
  - Evasion
  - ArmorEvasion
  - Block
  - CriticalResist
  - FrontAttackDefense
  - PvPDamageDefense

enhancement:
  # Cap how far ahead to suggest, so the list stays actionable.
  max_levels_ahead: 10
  # Ignore upgrades below this weighted score.
  min_weighted_gain: 5.0
  # Fetch headroom during snapshot. Costs one extra request per item, which
  # roughly doubles snapshot time, but makes the audit fully offline after.
  scan_on_snapshot: true
